version: 2.1

jobs:
  build-and-test:
    macos:
      xcode: "26.2.0"
    working_directory: /Users/distiller/project
    steps:
      - checkout
      - run:
          name: Validate Swift package graph
          command: make package-graph
      - run:
          name: Resolve and build package-backed Demo (Debug and Release, device and simulator)
          command: make build
      - run:
          name: Run package-backed simulator regression suite
          command: make test
      - store_artifacts:
          path: build/derived_data/Logs/Test

workflows:
  build-and-test:
    jobs:
      - build-and-test
